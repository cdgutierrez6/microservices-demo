sonar.projectKey=cdgutierrez6_microservices-demo
sonar.projectName=Microservices Demo
sonar.projectVersion=1.0

sonar.sources=api-gateway/src/main,order-service/src/main,user-service/src/main,notification-service/src/main
sonar.tests=api-gateway/src/test,order-service/src/test,user-service/src/test,notification-service/src/test
sonar.language=java
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# JaCoCo coverage reports (generated by mvn verify)
sonar.coverage.jacoco.xmlReportPaths=\
  order-service/target/site/jacoco/jacoco.xml,\
  user-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml

sonar.coverage.exclusions=**/config/**,**/dto/**,**/model/**,**Application.java
sonar.cpd.exclusions=**/test/**
